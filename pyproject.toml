[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mcsr-search-data"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
mcsr-generate = "mcsr_data.generate:main"
mcsr-import-icons = "mcsr_data.icon_import:main"

[tool.setuptools]
package-dir = {"" = "generator/src"}

[tool.setuptools.packages.find]
where = ["generator/src"]

[tool.setuptools.package-data]
mcsr_data = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["generator/src"]
testpaths = ["generator/tests"]
